name: Ollama Hybrid
version: 1.0.0
schema: v1
models:
  # Основной мозг в облаке Ollama Cloud (0 байт на диске)
  - name: GPT-OSS 120B (Cloud)
    provider: ollama
    model: gpt-oss:120b-cloud
    roles:
      - chat
      - edit
      - apply

  # Быстрый локальный автокомплит по Tab
  - name: Qwen Coder 1.5B (Local)
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    roles:
      - autocomplete

  # Локальные эмбеддинги для поиска по проекту (@codebase)
  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed